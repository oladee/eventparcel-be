# Build and deploy Node.js app to Azure Web App - app-serv-EventParcel-Backend-V2
name: Build and deploy Node.js app to Azure Web App - app-serv-EventParcel-Backend-V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          npm ci --production
      
      - name: Verify dist folder exists
        run: |
          echo "Checking dist folder..."
          ls -la dist/
          echo "✓ dist folder exists!"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_77A40FDA56B843C0B5F3801792566D82 }}
          tenant-id:${{ secrets.AZUREAPPSERVICE_TENANTID_41FB1875F5E64C9B9DA50DD78385C84F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A677752B631A413CBDE1B1F4BB79CC02 }}
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-serv-EventParcel-Backend-V2'
          slot-name: 'Production'
          package: .

