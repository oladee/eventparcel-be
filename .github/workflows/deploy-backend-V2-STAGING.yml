# Build and deploy Next.js app to Azure Web App (NO ARTIFACTS)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          npm ci --production

      - name: Verify dist folder exists
        run: |
          echo "Checking dist folder..."
          ls -la dist/
          echo "✓ dist folder exists!"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-serv-EventParcel-Backend-V2'
          publish-profile: ${{ secrets.AZUREWEBAPP_PUBLISH_PROFILE_STAGING }}
          package: .
